<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Учебный проект</title>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .container {
    background: rgba(255, 255, 255, 0.85);
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    max-width: 700px;
    width: 90%;
    text-align: center;
  }

  h1 {
    font-size: 2.5em;
    margin-bottom: 20px;
    color: #222;
  }

  p {
    font-size: 1.2em;
    margin-bottom: 30px;
  }

  a {
    text-decoration: none;
  }

  .button {
    background-color: #007bff;
    color: #fff;
    padding: 15px 30px;
    font-size: 1.2em;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background-color 0.3s, transform 0.2s;
  }

  .button:hover {
    background-color: #0056b3;
    transform: translateY(-2px);
  }
</style>
</head>
<body>
<div class="container">
  <h1>Учебный проект</h1>
  <h2>Создан в рамках производственной практики</h2>
  <p>Добро пожаловать!<br>
  Это учебный сайт для практической работы.<br>
  Нажмите кнопку ниже для перехода в Telegram-бота.</p>
  <a href="https://t.me/ВАШ_НИК_БОТА" target="_blank">
    <button class="button">Перейти к Telegram-боту</button>
  </a>
</div>
</body>
</html>
